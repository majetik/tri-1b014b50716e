<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="70.3">
<title>70.3 Tracker</title>
<style>
:root {
  --bg: #f6f6f3; --surface: #fcfcfb; --ink: #1b1c1a; --ink-2: #565852; --ink-3: #6f716a; --line: #e3e3de;
  --swim: #2474C9; --bike: #E8590C; --run: #0E9F8E; --support: #c9cac4;
  --good: #16723c; --warn: #8a5a00; --bad: #b3261e;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111110; --surface: #1a1a19; --ink: #f0f0ec; --ink-2: #b9bab3; --ink-3: #94958e; --line: #2e2e2b;
    --swim: #4C96E3; --bike: #DE6A1A; --run: #18A78E; --support: #474843;
    --good: #6fd08f; --warn: #eebd5c; --bad: #ff8d84;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
main { max-width: 720px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom)); display: grid; gap: 12px; }
header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
header p { margin: 0; color: var(--ink-2); font-size: 14px; }
h1, h2, h3, p { margin: 0; }
h2 { font-size: 15px; font-weight: 650; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; }
button { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 999px; min-height: 44px; padding: 0 14px; cursor: pointer; }
button:focus-visible, summary:focus-visible { outline: 2px solid var(--swim); outline-offset: 2px; }
#banner { display: none; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); font-size: 14px; }
#banner.show { display: block; }
.verdict { font-size: 28px; line-height: 1.15; font-weight: 720; letter-spacing: -.01em; margin-bottom: 4px; }
.verdict-row { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 650; margin-bottom: 8px; }
.on-track, .fast-ok { color: var(--good); } .close, .fast, .start { color: var(--warn); } .behind { color: var(--bad); }
.why { color: var(--ink-2); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.stats b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
.stats span { color: var(--ink-2); font-size: 13px; }
.bars { display: grid; gap: 10px; margin-top: 16px; }
.bar-label { display: flex; justify-content: space-between; font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.bar-label strong { color: var(--ink); font-weight: 600; }
.track { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin-top: 3px; }
.track i { display: block; height: 100%; border-radius: 4px; }
.support-line { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); color: var(--ink-3); font-size: 13px; }
.next { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 10px; }
.next li { display: grid; grid-template-columns: 4px 1fr auto; gap: 2px 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.next li:first-child { border-top: 0; padding-top: 0; }
.next .tick { grid-row: 1 / 3; border-radius: 2px; background: var(--ink-3); }
.next b { font-weight: 650; }
.next .mins { color: var(--ink-2); font-variant-numeric: tabular-nums; font-size: 14px; }
.next p { grid-column: 2 / 4; color: var(--ink-2); font-size: 14px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 2px 0; }
.chip { display: inline-flex; align-items: center; gap: 7px; flex: 1 1 auto; justify-content: center; color: var(--ink-2); }
.chip::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--c, transparent); opacity: .3; }
.chip.all::before { display: none; }
.chip[aria-pressed="true"] { color: var(--ink); border-color: var(--ink-3); font-weight: 600; }
.chip[aria-pressed="true"]::before { opacity: 1; }
.chart-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.chart-head span { color: var(--ink-3); font-size: 13px; }
.chart { position: relative; height: 230px; margin-top: 8px; }
.chart.short { height: 170px; }
details { margin-top: 12px; font-size: 14px; color: var(--ink-2); }
summary { cursor: pointer; min-height: 32px; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 5px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
footer { color: var(--ink-3); font-size: 12px; text-align: center; padding-top: 4px; }
</style>
</head>
<body>
<main>
  <header>
    <div><h1 style="font-size:17px">Ironman 70.3</h1><p id="race-date">October 17, 2027</p></div>
    <button id="refresh" type="button" aria-label="Refresh from Garmin">Refresh</button>
  </header>
  <div id="banner" role="status"></div>

  <section class="card" aria-labelledby="verdict">
    <div class="verdict-row" id="verdict-tag"></div>
    <h2 class="verdict" id="verdict">Loading…</h2>
    <p class="why" id="why"></p>
    <div class="stats">
      <div><b id="days">–</b><span>days to race</span></div>
      <div><b id="ready">–</b><span>of peak volume</span></div>
      <div><b id="phase">–</b><span>training phase</span></div>
    </div>
    <div class="bars" id="bars"></div>
    <p class="support-line" id="support"></p>
  </section>

  <section class="card">
    <h2>Best next steps</h2>
    <ul class="next" id="next"></ul>
  </section>

  <section class="card">
    <div class="chips" id="chips" role="group" aria-label="Choose sports to show"></div>
    <div class="chart-head" style="margin-top:12px"><h2>Weekly volume</h2><span>faded = history · dashed = plan · gray = support</span></div>
    <div class="chart"><canvas id="volume" role="img" aria-label="Weekly training hours by sport compared with plan"></canvas></div>
    <div class="chart-head" style="margin-top:14px"><h2>Intensity</h2><span>% of time in HR Zones 4–5</span></div>
    <div class="chart short"><canvas id="intensity" role="img" aria-label="Weekly share of hard training by sport"></canvas></div>
    <details><summary>View as table</summary><div class="table-wrap"><table id="table"></table></div></details>
  </section>

  <footer>Training guidance only, not medical advice.</footer>
</main>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
